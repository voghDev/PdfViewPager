import com.vanniktech.maven.publish.AndroidSingleVariantLibrary
import com.vanniktech.maven.publish.SonatypeHost

apply plugin: 'com.android.library'
apply plugin: 'checkstyle'
apply plugin: 'com.vanniktech.maven.publish'

android {
    namespace 'es.voghdev.pdfviewpager.library'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        minSdk 15
        targetSdk 34
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError false
    }

    buildFeatures {
        buildConfig true
    }
}

task checkstyle(type: Checkstyle) {
    configFile = rootProject.file('config/checkstyle.xml')

    source 'src'
    include '**/*.java'
    exclude '**/gen/**'

    classpath = files()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'
}

mavenPublishing {
    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL)
    signAllPublications()
    configure(new AndroidSingleVariantLibrary("release", true, true))
}

signing {
    def signingKey = findProperty("signingInMemoryKey") as String
    def signingPassword = findProperty("signingInMemoryKeyPassword") as String
    def signingKeyId = findProperty("signingInMemoryKeyId") as String
    if (signingKey != null && signingPassword != null) {
        if (!signingKey.startsWith("-----BEGIN")) {
            signingKey = new String(signingKey.decodeBase64())
        }
        useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
    }
}
